<main>
  <section class="title-container">
    <h1>{{ t('projects.projects_title') | async }}</h1>
    <p>
      {{ t('projects.projects_description') | async }}
    </p>
   
  </section>
  <section class="card-container">
    <div class="cards" *ngFor="let item of projeto">
      <img [src]="item.imagem" [alt]="item.titulo" />
      <h3>{{ item.titulo }}</h3>
      
      <div class="scrool">
        <p>{{ item.descricao }}</p>
      </div>

      <div class="button-container">
        <a (click)="openModal(item.video)">{{ t('projects.video_button') | async }}</a>
        <a [href]="item.link" target="_blank">{{ t('projects.github_buton') | async }}</a>
      </div>

    </div>
  </section>
</main>
<p-dialog  [modal]="true" [(visible)]="visible" class="div-modal" [style]="{width: '800px' }">
  <div *ngIf="visible" class="modal">
    <app-video [title]="videoTitle"></app-video>
  </div>
</p-dialog>
